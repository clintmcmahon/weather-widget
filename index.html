<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Weather Widget</title>
  <link rel="stylesheet" href="weather-widget.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.6;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #ddd;
    }

    .site-header a {
      font-weight: 600;
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 640px;
      margin: 48px auto;
      padding: 0 24px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="/">Your Site</a>

    <!-- Change the city by editing these attributes -->
    <div
      class="weather-widget"
      id="weather-widget"
      data-lat="44.9778"
      data-lon="-93.2650"
      data-city="Minneapolis"
      data-label="MSP"
      data-timezone="America/Chicago"
      hidden
    >
      <span class="weather-icon" aria-hidden="true"></span>
      <span class="weather-temp"></span>
      <span class="weather-loc"></span>
    </div>
  </header>

  <main>
    <h1>Weather widget demo</h1>
    <p>The current conditions are in the upper right corner. This page has no server code. The browser calls Open-Meteo directly.</p>
  </main>

  <script src="weather-widget.js" defer></script>

</body>
</html>
